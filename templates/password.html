{{template "header" .}}

<div class="narrow" style="padding-top:3rem">
  <h2>{{template "icon" "lock"}} Password Required</h2>
  {{if .Locked}}<p class="meta locked-name"><strong>{{.Locked}}</strong> is password protected.</p>{{end}}
  {{if eq .FlashType "error"}}
    <div class="alert error" role="alert">{{.Flash}}</div>
  {{end}}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <label for="password">Password</label>
    <input type="password" name="password" id="password" class="input" autofocus required placeholder="Enter password">
    <button type="submit" class="btn primary" style="width:100%;margin-top:.5rem">Unlock</button>
  </form>
</div>

{{template "footer" .}}
