{{template "header" .}}

<div class="page-bar">
  <h2>Gallery</h2>
  <div class="tabs">
    <a href="/history">List</a>
    <a href="/gallery" class="active" aria-current="page">Gallery</a>
  </div>
</div>

{{if not .Files}}
  <p class="meta">No images yet.</p>
{{else}}
  <div class="grid">
    {{range .Files}}
    <a href="/{{.ID}}" class="thumb gallery-item" data-id="{{.ID}}" data-raw="/{{.ID}}/raw" data-name="{{.Name}}">
      <img src="{{if canThumb .Mimetype}}/{{.ID}}/thumb{{else}}/{{.ID}}/raw{{end}}" data-fallback="/{{.ID}}/raw" alt="{{.Name}}" loading="lazy">
      <span>{{.Name}}</span>
    </a>
    {{end}}
  </div>
  <script src="/static/lightbox.js"></script>
{{end}}

{{template "footer" .}}
